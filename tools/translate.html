<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate anything</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-hover: rgba(51, 65, 85, 0.8);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.2);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --radius: 16px;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease-in-out; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg-color) 80%);
            color: var(--text);
            font-family: var(--font-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { max-width: 500px; width: 100%; }

        .tool-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #fff; }
        p { color: var(--muted); margin-bottom: 20px; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            resize: vertical;
        }

        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover { filter: brightness(1.1); transform: scale(1.01); }

        #outputBox {
            width: 100%;
            min-height: 60px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.4);
            word-wrap: break-word;
            color: var(--primary);
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            white-space: pre-wrap; /* Ensures spacing/line breaks are preserved */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tool-card">
            <h1>Translate tool</h1>
            <p>Paste your text and translate anything.</p>
            
            <textarea id="textInput" placeholder="Type or paste something here..."></textarea>
            <button id="convertBtn">Translate</button>
            
            <div id="outputBox">Translation will appear here...</div>
        </div>
    </div>

    <script>
    const input = document.getElementById('textInput');
    const button = document.getElementById('convertBtn');
    const output = document.getElementById('outputBox');

    button.addEventListener('click', () => {
        const text = input.value;
        const parts = text.split(/([a-zA-Z0-9]+)/);
        
        const translated = parts.map(part => {
            return /[a-zA-Z0-9]/.test(part) ? 'nigger' : part;
        }).join('');

        output.textContent = translated;
    });
</script>
</body>
</html>
